name: Release tag

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version in SemVer form, for example v1.2.3"
        required: true
        type: string
      dry_run:
        description: "Run all release checks without creating a tag"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Validate release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo 'A release can only be dispatched from main.' >&2
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo 'Version must be a v-prefixed SemVer value, for example v1.2.3.' >&2
            exit 1
          fi

          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$VERSION" >/dev/null; then
            echo "Tag $VERSION already exists." >&2
            exit 1
          fi

          echo "tag=$VERSION" >> "$GITHUB_OUTPUT"

  quality:
    name: Release quality gates
    needs: prepare
    uses: ./.github/workflows/ci.yml

  tag:
    name: Create release tag
    needs: [prepare, quality]
    if: inputs.dry_run == false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          git fetch --tags --force
          if git rev-parse --verify --quiet "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists." >&2
            exit 1
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag --annotate "$TAG" "$GITHUB_SHA" --message "Release $TAG"
          git push origin "refs/tags/$TAG"
