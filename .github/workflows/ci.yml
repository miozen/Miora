name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  server:
    name: Server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "8"
          cache: maven
      - run: mvn -pl blog -am test

  admin:
    name: Admin
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: admin/package-lock.json
      - run: npm ci
      - run: npm run build

  blog:
    name: Blog
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: blog
    env:
      NEXT_PUBLIC_PROJECT_API: /api
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: blog/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  compose:
    name: Compose
    runs-on: ubuntu-latest
    env:
      MYSQL_PASSWORD: ci-validation-database-password
      MYSQL_ROOT_PASSWORD: ci-validation-root-password
      JWT_SECRET_KEY: ci-validation-jwt-secret
    steps:
      - uses: actions/checkout@v5
      - run: |
          for env_file in .env.example environments/test.env.example environments/staging.env.example; do
            docker compose --env-file "$env_file" config --quiet
          done
      - env:
          IMAGE_TAG: v0.0.0-ci
          MYSQL_DATABASE: miora_ci
          MYSQL_USER: miora
          MYSQL_PASSWORD: ci-validation-database-password
          MYSQL_ROOT_PASSWORD: ci-validation-root-password
          JWT_SECRET_KEY: ci-validation-jwt-secret
          BLOG_HOST: ci.example.com
          ADMIN_HOST: admin.ci.example.com
        run: docker compose -f compose.production.yaml config --quiet
