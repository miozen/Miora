services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:?set MYSQL_DATABASE in the deployment environment}
      MYSQL_USER: ${MYSQL_USER:?set MYSQL_USER in the deployment environment}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in the deployment environment}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in the deployment environment}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  server:
    image: ghcr.io/miozen/miora-server:${IMAGE_TAG:?set IMAGE_TAG to a vX.Y.Z release}
    restart: unless-stopped
    depends_on:
      mysql: { condition: service_healthy }
    environment:
      PORT: 9003
      DB_INFO: mysql:3306/${MYSQL_DATABASE}
      DB_USERNAME: ${MYSQL_USER}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in the deployment environment}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      FILE_DIR: /app/upload
      FILE_PUBLIC_URL: ${FILE_PUBLIC_URL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-false}
    volumes: [upload-data:/app/upload]
    ports: ["${SERVER_BIND_ADDRESS:-127.0.0.1}:${SERVER_PORT:-9663}:9003"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9003/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s
    networks: [backend, edge]

  blog:
    image: ghcr.io/miozen/miora-blog:${IMAGE_TAG:?set IMAGE_TAG to a vX.Y.Z release}
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    environment:
      PORT: 9001
      HOSTNAME: 0.0.0.0
      PROJECT_API_INTERNAL: http://server:9003/api
    ports: ["${BLOG_BIND_ADDRESS:-127.0.0.1}:${BLOG_PORT:-9661}:9001"]
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9001').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s
    networks: [edge]

  admin:
    image: ghcr.io/miozen/miora-admin:${IMAGE_TAG:?set IMAGE_TAG to a vX.Y.Z release}
    restart: unless-stopped
    depends_on:
      server: { condition: service_healthy }
    ports: ["${ADMIN_BIND_ADDRESS:-127.0.0.1}:${ADMIN_PORT:-9662}:80"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s
    networks: [edge]

volumes:
  mysql-data:
  upload-data:

networks:
  backend:
    internal: true
  edge:
    name: ${COMPOSE_PROJECT_NAME:-miora}-edge
