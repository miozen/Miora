services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-thrivex}
      MYSQL_USER: ${MYSQL_USER:-thrivex}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/ThriveX.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 12

  server:
    build:
      context: ./server
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 9003
      DB_INFO: mysql:3306/${MYSQL_DATABASE:-thrivex}
      DB_USERNAME: ${MYSQL_USER:-thrivex}
      DB_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
      FILE_DIR: /app/upload
      FILE_PUBLIC_URL: ${FILE_PUBLIC_URL:-}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-local}
      STORAGE_S3_ENDPOINT: ${STORAGE_S3_ENDPOINT:-}
      STORAGE_S3_REGION: ${STORAGE_S3_REGION:-}
      STORAGE_S3_BUCKET: ${STORAGE_S3_BUCKET:-}
      STORAGE_S3_PREFIX: ${STORAGE_S3_PREFIX:-}
      STORAGE_S3_ACCESS_KEY: ${STORAGE_S3_ACCESS_KEY:-}
      STORAGE_S3_SECRET_KEY: ${STORAGE_S3_SECRET_KEY:-}
      STORAGE_S3_PUBLIC_URL: ${STORAGE_S3_PUBLIC_URL:-}
      STORAGE_S3_PATH_STYLE: ${STORAGE_S3_PATH_STYLE:-false}
    volumes:
      - upload-data:/app/upload
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:9003/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  blog:
    build:
      context: ./blog
      args:
        NEXT_PUBLIC_PROJECT_API: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      PORT: 9001
      HOSTNAME: 0.0.0.0
      PROJECT_API_INTERNAL: http://server:9003/api
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9001').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 30s

  admin:
    build:
      context: ./admin
      args:
        VITE_PROJECT_API: /api
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      blog:
        condition: service_healthy
      admin:
        condition: service_healthy
      server:
        condition: service_healthy
    environment:
      BLOG_HOST: ${BLOG_HOST:-localhost}
      ADMIN_HOST: ${ADMIN_HOST:-admin.localhost}
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./deploy/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 10s

volumes:
  mysql-data:
  upload-data:
